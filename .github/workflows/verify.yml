# The fast gates of ./verify on every pull request: main only accepts pull requests where this job
# is green (repository ruleset), and auto-merge.yml merges them then, without human review. The
# full run (Docker integration tests, mutation testing, copy-paste detection, ~15 min) runs on main
# every night and on demand: a red one is fixed by the next pull request. Not on each merge: a merge
# made by auto-merge comes from the workflow token, and GitHub starts no workflow for its events.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # The job name is the status check the ruleset requires: rename both together.
    name: verify
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ratchet compares with the base commit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: ./verify
        env:
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./verify
      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: target/verify.log

  full:
    name: verify-full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: ./verify --full (Docker integration tests, mutation testing, copy-paste detection)
        env:
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./verify --full
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-full-reports
          path: |
            target/verify.log
            target/pit-reports/
            target/site/jacoco/
